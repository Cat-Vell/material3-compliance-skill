name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Skill, structure, scanner, and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Behavior fixture schema
        run: python tests/validate_fixtures.py
      - name: Archived behavior run-record schema
        run: python tests/validate_eval_runs.py
      - name: Trigger case schema
        run: python evals/trigger/score_trigger_runs.py
      - name: Behavior run matrix dry-run
        run: python evals/generate_run_matrix.py --dry-run
      - name: Benchmark placeholder refresh
        run: python evals/benchmark_report.py
      - name: Portable skill and repository validation
        run: python tests/validate_repository.py
      - name: Scanner fixture benchmark
        run: python skills/material3-design/scripts/m3_engine/benchmark.py

  behavior-release-gate:
    name: Revision-anchored host behavior evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require complete Codex and Claude fixture runs
        run: python tests/validate_eval_runs.py --require-host codex --require-host claude --require-all-fixtures

  compose-core:
    name: Compose core build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/material3-design/assets/templates/compose-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK baseline
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.5.0"
      - name: Build and test stable core
        run: gradle testDebugUnitTest assembleDebug --stacktrace

  flutter-core:
    name: Flutter core analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/material3-design/assets/templates/flutter-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  web-core:
    name: Web core clean build, tests, and a11y smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/material3-design/assets/templates/web-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skills/material3-design/assets/templates/web-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
