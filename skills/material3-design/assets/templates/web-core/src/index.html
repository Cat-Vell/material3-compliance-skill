<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Material 3 Web Core</title>
    <link rel="stylesheet" href="tokens.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="top-bar">
        <span class="title">Material 3 Core</span>
        <button id="theme-toggle" class="icon-button" type="button" aria-pressed="false">Use dark theme</button>
      </header>
      <nav aria-label="Primary" class="primary-nav">
        <a href="#home" aria-current="page">Home</a>
        <a href="#library">Library</a>
        <a href="#settings">Settings</a>
      </nav>
      <main id="main" tabindex="-1">
        <h1 id="page-title">Home</h1>
        <p id="status" role="status" aria-live="polite"></p>
        <section class="collection" aria-labelledby="collection-title">
          <h2 id="collection-title">Recent items</h2>
          <div id="cards" class="card-grid"></div>
        </section>
        <button class="primary-action" type="button">Add item</button>
      </main>
    </div>
  </body>
</html>
